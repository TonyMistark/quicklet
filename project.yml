name: Quicklet
options:
  bundleIdPrefix: com.ice
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_IDENTITY: "-"
    # Single source of truth for the version: Info.plist references these, and
    # scripts/release.sh tags the same number.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Quicklet:
    type: application
    platform: macOS
    sources:
      - Quicklet
      - Shared
      - Resources
    dependencies:
      - target: QuickletFinder
        embed: true
        codeSign: true
        copy:
          destination: plugins
    info:
      path: Quicklet/Info.plist
      properties:
        CFBundleDisplayName: Quicklet
        CFBundleName: Quicklet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        NSHumanReadableDescription: "macOS Finder 右键菜单定制器"
        LSMinimumSystemVersion: "13.0"
        CFBundleIconFile: Quicklet
        # Regular app: visible in the Dock and the cmd+tab switcher. The menu
        # bar extra stays as a second entry point.
        CFBundleTypeRole: viewer
        CFBundleURLTypes:
          - CFBundleURLName: com.ice.quicklet.handoff
            CFBundleURLSchemes:
              - quicklet
    entitlements:
      path: Quicklet/Quicklet.entitlements
      properties:
        # Intentionally NOT sandboxed: the extension is sandboxed (required
        # by Finder Sync) and hands commands over so this app can spawn the
        # shell and open other applications.
        com.apple.security.application-groups:
          - group.com.ice.quicklet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ice.quicklet
        GENERATE_INFOPLIST_FILE: false

  QuickletFinder:
    type: app-extension
    platform: macOS
    sources:
      - FinderSync
      - Shared
    info:
      path: FinderSync/Info.plist
      properties:
        CFBundleDisplayName: Quicklet Finder Extension
        CFBundleName: QuickletFinder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderSync/QuickletFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.ice.quicklet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ice.quicklet.findersync
        GENERATE_INFOPLIST_FILE: false

  UIRender:
    type: tool
    platform: macOS
    sources:
      - UIRender
      - path: Quicklet
        excludes:
          - "QuickletApp.swift"
      - Shared
    settings:
      base:
        OTHER_SWIFT_FLAGS: "$(inherited) -disable-sandbox"
